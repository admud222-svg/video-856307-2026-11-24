<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Tonton video Minecraft SMP berdurasi 7 menit 31 detik.">
  <title>Video Minecraft SMP</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1220; color: #f8fafc; display: grid; place-items: center; }
    main { width: min(100%, 1000px); padding: clamp(16px, 4vw, 40px); }
    h1 { font-size: clamp(24px, 4vw, 36px); margin: 0 0 8px; }
    p { color: #cbd5e1; margin: 0 0 20px; }
    video { display: block; width: 100%; aspect-ratio: 20 / 9; background: #000; border-radius: 12px; }
    a { color: #93c5fd; }
    .links { margin-top: 18px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Video Minecraft SMP</h1>
    <p>Durasi 7 menit 31 detik · Tekan tombol putar untuk menonton.</p>
    <video controls playsinline preload="metadata" poster="poster.jpg">
      <source src="video.mp4" type="video/mp4">
      Browser ini tidak mendukung pemutaran video. <a href="video.mp4">Buka video langsung</a>.
    </video>
    <div class="links"><a href="video.mp4">Buka file video langsung</a></div>
  </main>
</body>
</html>
